name: Windows MSVC Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: x86_64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag does not match Cargo.toml version: $version"
          }
      - name: Build Windows x64 with static CRT
        shell: cmd
        run: build.bat
      - name: Inspect DLL dependencies and calculate checksum
        shell: pwsh
        run: |
          $dependencies = & dumpbin /dependents epub-reader.exe
          if ($LASTEXITCODE -ne 0) { throw "DLL inspection failed" }
          $dependencies | Write-Output
          if (($dependencies -join "`n") -match '(?i)(vcruntime|msvcp|libgcc|libstdc\+\+|libwinpthread).*\.dll') {
            throw "Unexpected compiler runtime DLL dependency"
          }
          $hash = (Get-FileHash epub-reader.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  epub-reader.exe" | Set-Content SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: epub-reader-windows-msvc
          path: |
            epub-reader.exe
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          Windows 10/11 x64 便携 EPUB 阅读器，下载 epub-reader.exe 后直接运行。

          - 修复老板键隐藏后事件循环持续轮询、CPU 占用过高的问题。
          - 老板键隐藏期间暂停鼠标检测，恢复后按用户设置重启；隐藏期间支持正常关闭。
          - 保留自定义老板键、鼠标自动显隐、窗口透明度与阅读位置恢复。
          - 删除测试及样书生成脚本，保留 Rust 回归测试和性能验证报告。

          构建：Rust 1.99.0，x86_64-pc-windows-msvc，release，静态 CRT。
          本地验证：42 项 Rust 测试、CLI 自检及启动冒烟通过；老板键隐藏后单核 CPU 占用降至约 0.05%–0.10%。
          执行桌面无法读取鼠标位置，真实鼠标移回恢复、物理热键及全屏视觉表现未人工验证。
          SHA-256 校验值见 SHA256SUMS.txt；性能数据和验证边界见 HIDDEN_CPU_REPORT.md。
          第三方许可随附件提供，使用说明见仓库 README。
          '@ | Set-Content release-notes.md -Encoding utf8NoBOM
          gh release create $env:GITHUB_REF_NAME epub-reader.exe SHA256SUMS.txt THIRD_PARTY_NOTICES.txt HIDDEN_CPU_REPORT.md --verify-tag --title "EPUB Reader $env:GITHUB_REF_NAME" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
